---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - clusteridentityproviders
  - identityproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - clusteridentityproviders/status
  - identityproviders/status
  - oidcclients/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - oidcclients
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - oidcclients/finalizers
  verbs:
  - update
