# This rule is not used by the project operator-oidc itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to oidc.craftainer.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator-oidc
    app.kubernetes.io/managed-by: kustomize
  name: clusteridentityprovider-viewer-role
rules:
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - clusteridentityproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - clusteridentityproviders/status
  verbs:
  - get
