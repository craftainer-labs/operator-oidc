# This rule is not used by the project operator-oidc itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the oidc.craftainer.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator-oidc
    app.kubernetes.io/managed-by: kustomize
  name: identityprovider-editor-role
rules:
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - identityproviders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - identityproviders/status
  verbs:
  - get
