---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-oidc-craftainer-dev-v1alpha1-clusteridentityprovider
  failurePolicy: Fail
  name: vclusteridentityprovider-v1alpha1.kb.io
  rules:
  - apiGroups:
    - oidc.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusteridentityproviders
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-oidc-craftainer-dev-v1alpha1-identityprovider
  failurePolicy: Fail
  name: videntityprovider-v1alpha1.kb.io
  rules:
  - apiGroups:
    - oidc.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - identityproviders
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-oidc-craftainer-dev-v1alpha1-oidcclient
  failurePolicy: Fail
  name: voidcclient-v1alpha1.kb.io
  rules:
  - apiGroups:
    - oidc.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - oidcclients
  sideEffects: None
