apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Developer Tools
    description: A Kubernetes operator that provisions OIDC clients on Keycloak and other OpenID Connect identity providers (oidc.craftainer.dev).
    # Pod Security `restricted` and a suggested install namespace for OLM v0
    # (OLM v1 installs into the ClusterExtension's namespace).
    operatorframework.io/suggested-namespace: operator-oidc-system
    # OpenShift infrastructure features (EB-5): "disconnected" is true when
    # every image the operator runs is listed in spec.relatedImages (the
    # bundle step pins and lists the manager image). "proxy-aware" and
    # "fips-compliant" are "false" in the features.operators.openshift.io keys
    # below: the operator reads no HTTP(S)_PROXY (set proxy-aware once it does), and
    # the build has no GOFIPS140 run with GODEBUG=fips140=on (see the Dockerfile).
    operators.openshift.io/infrastructure-features: '["disconnected"]'
    # The same features as OpenShift's current keys (EB-5). Not proxy-aware: the
    # operator reads no HTTP(S)_PROXY; a provider's proxy is its spec.proxyURL.
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    repository: https://github.com/craftainer-labs/operator-oidc
  name: operator-oidc.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ClusterIdentityProvider is a cluster-scoped Keycloak or dynamic-registration identity provider that the namespaces in allowedNamespaces may claim clients from.
      displayName: Cluster Identity Provider
      kind: ClusterIdentityProvider
      name: clusteridentityproviders.oidc.craftainer.dev
      version: v1alpha1
    - description: IdentityProvider is a Keycloak or dynamic-registration identity provider that only claims in its own namespace may use.
      displayName: Identity Provider
      kind: IdentityProvider
      name: identityproviders.oidc.craftainer.dev
      version: v1alpha1
    - description: OidcClient is an OpenID Connect client registered with an identity provider, its credentials written to a binding Secret.
      displayName: OIDC Client
      kind: OidcClient
      name: oidcclients.oidc.craftainer.dev
      version: v1alpha1
  description: |-
    Provisions OIDC clients from Kubernetes resources. A
    ClusterIdentityProvider or IdentityProvider names the identity provider
    (Keycloak, or any provider with RFC 7591 dynamic client registration) and
    its credentials; an OidcClient in a team's namespace claims a client from
    it, with the client id and secret written to a binding Secret.
  displayName: OIDC Operator
  install:
    spec:
      deployments: null
    strategy: ""
  # AllNamespaces is the only mode OLM v1 (ClusterExtension) installs without
  # legacy compatibility; OLM v0 supports it too.
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - operator
  - craftainer
  links:
  - name: Source
    url: https://github.com/craftainer-labs/operator-oidc
  maintainers:
  - email: maintainers@example.com
    name: Maintainers
  maturity: alpha
  minKubeVersion: 1.33.0
  provider:
    name: craftainer
    url: https://github.com/craftainer
  # The manager image is added by `make bundle` (scripts/bundle-fixup.sh) with
  # the digest it was built for.
  relatedImages: []
  version: 0.0.0
