apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "operator-oidc.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - clusteridentityproviders
  - identityproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - clusteridentityproviders/status
  - identityproviders/status
  - oidcclients/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - oidcclients
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - oidc.craftainer.dev
  resources:
  - oidcclients/finalizers
  verbs:
  - update
