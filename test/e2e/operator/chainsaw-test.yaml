# Installs the Helm chart into a Pod Security `restricted` namespace, with the
# manager running as an arbitrary UID, then exercises the oidc.craftainer.dev API
# end to end: the CRDs, their defaults, the webhooks and the providers' health
# probes (the OidcClient controller comes later). The steps run in order; the
# cluster is thrown away afterwards.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: operator
spec:
  namespaceTemplate:
    metadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
  steps:
    - name: install the chart
      try:
        - script:
            timeout: 5m
            env:
              - name: RELEASE
                value: operator-oidc
            content: |
              set -eu
              helm upgrade --install "$RELEASE" "$E2E_CHART_DIR" --namespace "$NAMESPACE" \
                --set manager.image.registry= \
                --set manager.image.repository="$E2E_IMAGE_REPOSITORY" \
                --set manager.image.tag="$E2E_IMAGE_TAG" \
                --set manager.image.pullPolicy=Never \
                --set manager.podSecurityContext.runAsUser=12345 \
                --set egressMode=allow-private \
                --set 'manager.extraEnv[0].name=NO_PROXY' \
                --set 'manager.extraEnv[0].value=.svc\,.cluster.local' \
                --wait --timeout 4m
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator-oidc-controller-manager
              status:
                availableReplicas: 1
      cleanup:
        - script:
            content: helm uninstall operator-oidc --namespace "$NAMESPACE" --ignore-not-found

    - name: runs as an arbitrary UID with leader election
      try:
        - script:
            content: |
              set -eu
              uid=$(kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].spec.securityContext.runAsUser}')
              test "$uid" = 12345
              ro=$(kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].spec.containers[0].securityContext.readOnlyRootFilesystem}')
              test "$ro" = true
              # EB-5: extraEnv reaches the container, after the chart's own.
              podenv() { kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath="{.items[0].spec.containers[0].env[?(@.name==\"$1\")].value}"; }
              test "$(podenv NO_PROXY)" = ".svc,.cluster.local"
              test "$(podenv EGRESS_MODE)" = allow-private
              # A name the chart sets itself is refused when the chart is rendered.
              if helm template x "$E2E_CHART_DIR" --set 'manager.extraEnv[0].name=EGRESS_MODE' \
                  --set 'manager.extraEnv[0].value=strict' >/dev/null 2>&1; then
                echo "extraEnv accepted EGRESS_MODE"
                exit 1
              fi
        - assert:
            resource:
              apiVersion: coordination.k8s.io/v1
              kind: Lease
              metadata:
                name: operator-oidc.craftainer.dev
              (spec.holderIdentity != null): true

    - name: the CRDs are established
      try:
        - script:
            timeout: 2m
            content: |
              set -eu
              for crd in clusteridentityproviders identityproviders oidcclients; do
                kubectl wait --for=condition=Established --timeout=60s "crd/${crd}.oidc.craftainer.dev"
              done

    - name: an IdentityProvider gets its schema defaults
      try:
        - apply:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: IdentityProvider
              metadata:
                name: keycloak
              spec:
                type: Keycloak
                issuer: https://sso.example.com/realms/craftainer
                keycloak: {baseURL: "https://sso.example.com", realm: craftainer}
                adminCredentialsSecretRef: {name: kc-operator}
        - assert:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: IdentityProvider
              metadata:
                name: keycloak
              spec:
                allowedScopes: [openid, profile, email]

    - name: a provider without its admin Secret is not Ready, and says why
      # The probe writes the status. The expressions are null-safe: a missing
      # field would make the filter fail instead of waiting out the timeout.
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: IdentityProvider
              metadata:
                name: keycloak
              status:
                (conditions[?type == 'Ready'] | [0].status): "False"
                (conditions[?type == 'Ready'] | [0].reason): InvalidServer

    - name: a provider that cannot be reached is not Ready, and its status names no host
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: kc-admin
              stringData:
                clientId: operator
                clientSecret: hunter2
        - apply:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: IdentityProvider
              metadata:
                name: unreachable
              spec:
                type: Keycloak
                issuer: https://kc.invalid/realms/craftainer
                keycloak: {baseURL: "https://kc.invalid", realm: craftainer}
                adminCredentialsSecretRef: {name: kc-admin}
        - assert:
            timeout: 3m
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: IdentityProvider
              metadata:
                name: unreachable
              status:
                (conditions[?type == 'Ready'] | [0].status): "False"
                (conditions[?type == 'Ready'] | [0].reason): ServerUnreachable
                (conditions[?type == 'ServerReachable'] | [0].status): "False"
                (lastProbeTime != `null`): true
                (contains(to_string(conditions), 'kc.invalid')): false
                (contains(to_string(conditions), 'hunter2')): false
                (discovery == `null`): true

    - name: the webhook rejects a proxy URL with credentials without echoing it
      try:
        - apply:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: IdentityProvider
              metadata:
                name: bad-proxy
              spec:
                type: Keycloak
                issuer: https://sso.example.com/realms/craftainer
                keycloak: {baseURL: "https://sso.example.com", realm: craftainer}
                proxyURL: http://user:hunter2@proxy:3128
                adminCredentialsSecretRef: {name: kc-operator}
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must not carry credentials')): true
                  (contains($error, 'hunter2')): false

    - name: an OidcClient gets its defaults
      try:
        - apply:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: OidcClient
              metadata:
                name: web
              spec:
                serverRef: {kind: IdentityProvider, name: keycloak}
                redirectUris: [https://app.example.com/callback]
        - assert:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: OidcClient
              metadata:
                name: web
              spec:
                public: false
                grantTypes: [authorization_code]
                pkce: S256
                scopes: [openid]

    - name: an OidcClient with a bypass-prone redirect URI is rejected
      try:
        - apply:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: OidcClient
              metadata:
                name: evil-host
              spec:
                serverRef: {kind: IdentityProvider, name: keycloak}
                redirectUris: ["http://localhost.evil.example/callback"]
                public: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'redirectUris')): true
        - apply:
            resource:
              apiVersion: oidc.craftainer.dev/v1alpha1
              kind: OidcClient
              metadata:
                name: wildcard
              spec:
                serverRef: {kind: IdentityProvider, name: keycloak}
                redirectUris: ["https://*.example.com/callback"]
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'wildcards')): true

    - name: metrics need a token
      try:
        - script:
            timeout: 5m
            content: |
              set -eu
              svc="operator-oidc-controller-manager-metrics-service.${NAMESPACE}.svc:8443"
              kubectl create serviceaccount metrics-client -n "$NAMESPACE"
              kubectl create clusterrolebinding "e2e-metrics-${NAMESPACE}" \
                --clusterrole=operator-oidc-metrics-reader --serviceaccount="${NAMESPACE}:metrics-client"
              token=$(kubectl create token metrics-client -n "$NAMESPACE")
              # curl runs in `default`: the test namespace enforces `restricted`.
              kubectl run "metrics-curl" -n default --rm -i --restart=Never \
                --image=curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40 \
                --command -- sh -c "
                  anon=\$(curl -ks -o /dev/null -w '%{http_code}' https://${svc}/metrics)
                  echo anonymous=\$anon
                  test \"\$anon\" = 401 -o \"\$anon\" = 403
                  curl -ks -H 'Authorization: Bearer ${token}' https://${svc}/metrics > /tmp/m
                  grep -q -E '^(go|process)_' /tmp/m
                  echo authenticated metrics ok"
      cleanup:
        - script:
            content: kubectl delete clusterrolebinding "e2e-metrics-${NAMESPACE}" --ignore-not-found
